<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ship Portal - Place Order</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<!-- Sidebar (hidden or toggled via button) -->

<div class="sidebar">
    <ul>
        <li><a href="OrderHistory.html">Order History</a></li>
        <li><a href="TrackOrder.html">Track Order</a></li>
    </ul>
</div>

<!-- Main content area (form) -->
<div class="container">
    <div class="form-container">
        <h2>Place a Shipping Order</h2> <!-- Title above the form -->

        <!-- Shipping Order Form -->
        <form  action="#" th:action="@{/api/Saved}" th:object="${saved}" method="post" >
            <div class="form-group">
                <label for="Name">Name:</label>
                <input type="text" id="Name" th:field="*{Name}" placeholder="Enter your name" required />
            </div>

            <div class="form-group">
                <label for="ContactNumber">Contact Number:</label>
                <input type="number" id="ContactNumber" th:field="*{ContactNumber}" placeholder="Enter your contact number" required />
            </div>

            <div class="form-group">
                <label for="Address">Address:</label>
                <textarea id="Address" th:field="*{Address}"  placeholder="Enter your address" required></textarea>
            </div>

            <div class="form-group">
                <label for="StartCity">Start City:</label>
                <input type="text" id="StartCity" th:field="*{StartCity}" placeholder="Enter the start city" required />
            </div>

            <div class="form-group">
                <label for="DestinationCity">Destination City:</label>
                <input type="text" id="DestinationCity" th:field="*{DestinationCity}" placeholder="Enter the destination city" required />
            </div>

            <div class="form-group">
                <label for="Amount">Amount:</label>
                <input type="number" id="Amount" th:field="*{Amount}" placeholder="Enter the shipping amount" required />
            </div>

            <div class="form-group">
                <button type="submit" class="submit-btn">Place Order</button>
            </div>
        </form>
    </div>
</div>
<!-- JavaScript file with the required functionality -->
<script>
    // Sidebar toggle functionality
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');

    sidebarToggle.onclick = function() {
        if (sidebar.style.width === '250px') {
            sidebar.style.width = '0';
        } else {
            sidebar.style.width = '250px';
        }
    };
</script>
</body>
</html>
